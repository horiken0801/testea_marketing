name: Generate content

# NOTE: フル自動運用フェーズは一旦保留中。中学受験Threads下書き機能
# (threads-trend-drafts.yml) を先行運用するため、定期実行は止めています。
# 再開する場合は下の schedule のコメントを外してください。
on:
  # schedule:
  #   - cron: "0 12 * * 0" # 毎週日曜 21:00 JST に翌週分のドラフトを生成
  workflow_dispatch:
    inputs:
      count:
        description: "プラットフォームごとに生成する投稿数"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sns-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - run: python scripts/generate_content.py --count "${{ github.event.inputs.count || 3 }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

      - name: Commit generated queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_queue/queue.json
          git diff --cached --quiet || git commit -m "chore: generate scheduled content"
          git push
